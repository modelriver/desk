# Desk on Fly.io: the published image, one machine and a volume for its data.
# Fly handles HTTPS. See deploy/README.md ("Fly.io") for the commands.
#
# `fly launch --copy-config --no-deploy` fills in your app name and region.

app = "desk"
primary_region = "iad"

[build]
  # 1 follows every 1.x release; pin one with e.g. ghcr.io/modelriver/desk:1.0.0.
  image = "ghcr.io/modelriver/desk:1"

[env]
  # Fly puts the visitor's address in this header; Desk rate-limits by it.
  CLIENT_IP_HEADER = "fly-client-ip"

# Articles, notes, the database and branding. Created on the first deploy.
[[mounts]]
  source = "desk_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep it running: rate limits live in memory, and email notifications are
  # sent a few seconds after the event.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/robots.txt"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

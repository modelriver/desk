# Desk behind Caddy, which gets and renews the HTTPS certificate on its own.
# This file and a .env next to it are all a server needs:
#
#   curl -fsSLO https://raw.githubusercontent.com/modelriver/desk/main/docker-compose.yml
#   curl -fsSL https://raw.githubusercontent.com/modelriver/desk/main/deploy/docker/env.example -o .env
#   (fill in .env)
#   docker compose up -d
#   docker compose exec desk node scripts/create-admin.ts
#
# Point DESK_DOMAIN's DNS at this server and open ports 80 and 443 first.
# To build from your own copy of the code instead of pulling the image, add
# docker-compose.source.yml. See deploy/README.md for the rest.

services:
  desk:
    # 1 follows every 1.x release; set DESK_VERSION in .env to pin one (1.0.0).
    image: ghcr.io/modelriver/desk:${DESK_VERSION:-1}
    restart: unless-stopped
    env_file: .env
    # Fixed for the container; everything else comes from .env.
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /data/data
      DATABASE_PATH: /data/desk.db
      # Caddy is the one proxy in front, so its X-Forwarded-For entry is the visitor.
      TRUST_PROXY_HOPS: "1"
    volumes:
      - desk-data:/data
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Only one Desk at a time: rate limits live in memory and the database is one file.

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      desk:
        condition: service_healthy

configs:
  # Caddy's settings, kept here so there's no other file to download. It gets
  # a certificate for DESK_DOMAIN from Let's Encrypt, renews it, and redirects
  # HTTP to HTTPS. Only the domain reaches Caddy, never your keys.
  caddyfile:
    content: |
      ${DESK_DOMAIN:?Set DESK_DOMAIN in .env} {
        encode zstd gzip

        # Desk refuses bigger requests anyway; stop them here first.
        request_body {
          max_size 2MB
        }

        # Caddy replaces any X-Forwarded-For a visitor sends with their real
        # address, which Desk reads with TRUST_PROXY_HOPS=1.
        reverse_proxy desk:3000
      }

volumes:
  # Your articles, notes, database and branding. Back this up.
  desk-data:
  # Caddy's certificates.
  caddy-data:
  caddy-config:

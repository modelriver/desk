name: Docker

# Pushes and pull requests: build the image and check that it starts.
# A version tag (v1.2.3) also publishes it to ghcr.io/modelriver/desk for
# amd64 and arm64, tagged 1.2.3, 1.2, 1 and latest.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

env:
  # The name docker-compose.yml pulls.
  IMAGE: ghcr.io/modelriver/desk

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to exact commits so a moved tag can't change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check docker-compose.yml
        run: |
          cp deploy/docker/env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.source.yml config --quiet

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: desk:check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Two ways it gets started: as root on a root-owned volume (Railway,
      # Render, Fly), and as node with no capabilities (docker-compose.yml).
      - name: Start it both ways and wait until each is healthy
        run: |
          wait_healthy() {
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$1")
              [ "$status" = healthy ] && { echo "$1 healthy after ${i}0 s"; return 0; }
              [ "$(docker inspect -f '{{.State.Running}}' "$1")" = true ] || break
              sleep 10
            done
            docker logs "$1"
            return 1
          }
          docker volume create rootvol
          docker run --rm -v rootvol:/data --entrypoint sh desk:check -c 'chown root:root /data && chmod 755 /data'
          docker run -d --name as-root -v rootvol:/data -e DESK_SAMPLE_DATA=true desk:check
          docker run -d --name as-node --user node --cap-drop ALL --security-opt no-new-privileges desk:check
          wait_healthy as-root
          wait_healthy as-node
          # Desk itself must run as node, and own its data, even when started as root.
          [ "$(docker exec as-root sh -c "awk '/^Uid:/ {print \$2}' /proc/1/status")" = 1000 ]
          [ -z "$(docker exec as-root find /data ! -user node)" ]

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"; exit 1; }

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Desk
            org.opencontainers.image.description=Open-source AI support desk built on ModelRiver

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
